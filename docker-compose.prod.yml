# ============================================================
# Offer捕手 - 生产环境 Docker Compose
#
# Project name 固定，防止目录名变化导致新 volume：
name: ${COMPOSE_PROJECT_NAME:-wenqing-hr-demo}
#
# 架构:
#   用户浏览器 → web(Nginx:80) → /api/* → server(Go:8080)
#                                     → mysql(3306)
#                                     → redis(6379)
#
# ── 生产上线命令（正确）──────────────────────────────────
#   # 第一步：从模板创建 .env.prod 并填入真实密钥
#   cp .env.prod.example .env.prod
#
#   # 第二步：验证配置（不启动容器）
#   docker compose --project-name wenqing-hr-demo --env-file .env.prod -f docker-compose.prod.yml config
#
#   # 第三步：构建镜像并启动
#   docker compose --project-name wenqing-hr-demo --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# ── 生产安全禁令 ─────────────────────────────────────────
#   ❌ 不要 source .env.prod（DB_DSN 含 tcp()/?/& 等特殊字符）
#   ❌ 不要省略 --env-file .env.prod（compose 默认只读 .env）
#   ❌ 不要省略 --project-name（防止目录变化创建新 volume）
#   ❌ 不要执行 docker compose down -v（会删除数据库 volume）
#   ❌ 不要删除 mysql_data / redis_data volume
#   ❌ 不要在生产手动执行 server/sql/init.sql（会 DROP TABLE）
#
# ── 注意事项 ──────────────────────────────────────────────
#   • 默认 prod compose 不再挂载 init.sql（已移至 bootstrap override）
#   • 全新空库初始化请阅读 docs/mcp/DEPLOY-PROD-DATA-PROTECTION-P1.md
#   • COMPOSE_PROJECT_NAME 首次部署后不得随意修改
#   • 可用 make prod-check / make prod-config 进行部署前安全检查
#     make prod-backup 执行部署前数据库备份
# ============================================================

services:
  # ── MySQL 数据库 ──
  mysql:
    image: mysql:8.0
    container_name: offer-catcher-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      # DO NOT mount server/sql/init.sql in default production compose.
      # It contains DROP TABLE and is unsafe for production default startup.
      # See docker-compose.prod.bootstrap.yml for brand-new empty DB init.
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - offer-catcher-prod

  # ── Redis 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: offer-catcher-redis-prod
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - offer-catcher-prod

  # ── Go 后端 ──
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: offer-catcher-server:prod
    container_name: offer-catcher-server-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # 强制覆盖容器内连接地址
      APP_ENV: production
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8080/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - offer-catcher-prod

  # ── 前端 Nginx ──
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: offer-catcher-web:prod
    container_name: offer-catcher-web-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - offer-catcher-prod

# ── Volumes ──
volumes:
  mysql_data:
  redis_data:

# ── Networks ──
networks:
  offer-catcher-prod:
    driver: bridge
