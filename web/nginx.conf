# ============================================================
# Offer捕手 - 前端静态容器 Nginx 配置（独立静态托管）
#
# 本容器只负责 Offer Web 静态资源 + SPA fallback。
# 公共 Gateway（web-deploy 仓库）负责 /offer/* 前缀剥离、
# /api/* 反向代理与特殊超时策略，本文件不再包含任何后端反代。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_vary on;

    # ---- 自身健康检查（不依赖后端 API）----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 静态资源：严格文件匹配，缺失返回真实 404 ----
    # 哈希文件可长期 immutable 缓存。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- HTML 入口不做长期缓存（区别于哈希静态资源）----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
