# ============================================================
# Offer 捕手 - Docker Compose 配置（混合式开发环境）
# 说明：
# 1. Docker Compose 仅管理 MySQL + Nginx
# 2. Backend / Frontend 由 Makefile 以本机后台进程管理
# 3. Nginx 通过 host.docker.internal 代理宿主机 Backend / Frontend
# 4. 环境变量从根目录 .env 读取，不存在时使用默认值
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: offer-catcher-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offer_catcher}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - offer_catcher_net

  nginx:
    image: nginx:alpine
    container_name: offer-catcher-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - offer_catcher_net

volumes:
  mysql_data:

networks:
  offer_catcher_net:
    driver: bridge
